[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "sin-security-bundle"
version = "1.0.0"
description = "Unified SIN-Code Security Bundle (SCA, Container, IaC, License, DAST)"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Open SIN-Code Initiative"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/OpenSIN-Code/SIN-Code-Bundle"
Repository = "https://github.com/OpenSIN-Code/SIN-Code-Bundle"

[tool.setuptools.packages.find]
where = ["src"]
