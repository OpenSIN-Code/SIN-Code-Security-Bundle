name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-go:
    name: Go Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.21', '1.22']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      
      - name: Run tests
        run: make test-go
      
      - name: Build CLI
        run: make build
      
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: sin-security-go-${{ matrix.go-version }}
          path: bin/sin-security
  
  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run tests
        run: |
          python -m venv venv
          source venv/bin/activate
          pytest tests/ -v
  
  build-multiplatform:
    name: Build Binaries
    runs-on: ubuntu-latest
    needs: [test-go, test-python]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      
      - name: Build all platforms
        run: make build-all
      
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: sin-security-binaries
          path: bin/
